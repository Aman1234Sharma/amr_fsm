bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /lidar/odom #/odometry/filtered
    transform_tolerance: 0.2
    default_server_timeout: 1000
    bt_loop_duration: 10
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: "/workspaces/amr_ws/src/amr_nav/behaviour_tree/nav2_recovery.xml"
    default_nav_through_poses_bt_xml: "/workspaces/amr_ws/src/amr_nav/behaviour_tree/nav2_recovery.xml"
