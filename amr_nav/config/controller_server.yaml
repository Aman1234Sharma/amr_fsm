  controller_server:
    ros__parameters:
      # controller server parameters (see Controller Server for more info)
      use_sim_time: false  # set
      controller_frequency: 20.0 #tune
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.0
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      odom_topic : "/odometry/filtered" #"/lidar/odom" # "/odometry/filtered"
      progress_checker_plugins: "progress_checker" # progress_checker_plugin: "progress_checker" For Humble and older
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0

      general_goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.5 # default = 0.25
        yaw_goal_tolerance: 0.25
        stateful: True
        latch_xy_goal_tolerance: true

      # MPPI conroller parameters
      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 56 #default = 56
        model_dt: 0.05  #tune
        batch_size: 3000 #tune 1000 @ 50 Hz or 2000 @ 30 Hz seems to produce good results as per documentation
        vx_std: 0.4 #tune
        vy_std: 0.4 #tune 
        wz_std: 0.4 #tune
        vx_max: 0.5 #tune
        vx_min: -0.4   #tune
        vy_max: 0.0 #tune
        wz_max: 0.5 #tune
        retry_attempt_limit: 3 #tune
        iteration_count: 1 # recommended to keep as 1
        prune_distance: 1.7 # default 1.5
        transform_tolerance: 0.2 # default = 0.1 
        #enforce_path_inversion: false # Enforce exact reversal at path cusps
        #inversion_xy_tolerance: 0.25 #default = 0.25
        #inversion_yaw_tolerance: 0.4 #default = 0.4
        temperature: 0.3 #tune (best=0) earlier = 0.2
        gamma: 0.015 # tune for smoother vs jerky (energy) motion , default works mostly good
        motion_model: "DiffDrive"
        visualize: false # can be turned on for debugging
        publish_optimal_trajectory: false #default = false
              
        TrajectoryValidator:
          plugin: "mppi::DefaultOptimalTrajectoryValidator"
          collision_lookahead_time: 5.0
          consider_footprint: true

        TrajectoryVisualizer:
          trajectory_step: 5
          time_step: 3

        critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 4.0

        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 1.4
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.5

        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0 #tuned default = 5
          threshold_to_consider: 0.5

        
        ObstaclesCritic:
          enabled: true
          cost_power: 1
          repulsion_weight: 1.0 default = 1.5
          critical_weight: 20.0 #default 20
          consider_footprint: true
          collision_cost: 100000.0
          collision_margin_distance: 0.2 #default = 0.1
          near_goal_distance: 0.2 # default = 0.5
          cost_scaling_factor: 3.0 #  must be same as costmap cost_scaling factor
          inflation_radius: 0.45 # must be same as costmap inflation radius
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.81
          critical_cost: 300.0 #default = 300
          consider_footprint: true
          collision_cost: 1000000.0
          near_goal_distance: 0.5 #default = 0.5
          trajectory_point_step: 2 # default = 2
          near_collision_cost: 253 #default = 253
  

        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 23.0 #default = 10
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 4
          threshold_to_consider: 0.5
          offset_from_furthest: 20
          use_path_orientations: true #default = false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 12.0 #default = 5
          offset_from_furthest: 5
          threshold_to_consider: 1.4
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 6.2 #default = 2.2
          offset_from_furthest: 20
          threshold_to_consider: 0.5
          max_angle_to_furthest: 0.785398
          forward_preference: true
          mode: 1 #default = 0
        # VelocityDeadbandCritic:
        #   enabled: true
        #   cost_power: 1
        #   cost_weight: 35.0
        #   deadband_velocities: [0.05, 0.05, 0.05]
        # TwirlingCritic:
        #   enabled: true
        #   twirling_cost_power: 1
        #   twirling_cost_weight: 20.0

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 3.0
        publish_frequency: 3.0
        global_frame: odom
        robot_base_frame: base_link
        use_sim_time: false
        footprint: "[ [-0.45, -0.325], [-0.45, 0.325], [0.45, 0.325], [0.45, -0.325] ]"
        resolution: 0.05
        rolling_window: true
        width: 5
        height: 5

        plugins: ["obstacle_layer","inflation_layer"] # voxel_layer
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: /filtered_scan
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0

        # stvl_layer:
